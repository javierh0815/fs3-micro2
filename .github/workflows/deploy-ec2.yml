name: Deploy threads to EC2

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: threads
  CONTAINER_NAME: threads

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists and build/push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy container on EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy threads" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/oracle-wallet\",
              \"aws s3 cp s3://${{ vars.ORACLE_WALLET_S3_BUCKET }}/${{ vars.ORACLE_WALLET_S3_KEY }} /tmp/Wallet.zip --region $AWS_REGION\",
              \"unzip -oq /tmp/Wallet.zip -d /opt/oracle-wallet\",
              \"chmod -R a+rX /opt/oracle-wallet\",
              \"SECRET_JSON=\$(aws secretsmanager get-secret-value --secret-id '${{ vars.ORACLE_CREDENTIALS_SECRET_ARN }}' --region $AWS_REGION --query SecretString --output text)\",
              \"DB_URL=\$(echo \$SECRET_JSON | jq -r .DB_URL)\",
              \"DB_USERNAME=\$(echo \$SECRET_JSON | jq -r .DB_USERNAME)\",
              \"DB_PASSWORD=\$(echo \$SECRET_JSON | jq -r .DB_PASSWORD)\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker rm -f $CONTAINER_NAME || true\",
              \"docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 127.0.0.1:8081:8081 -v /opt/oracle-wallet:/app/wallet:ro -e TNS_ADMIN=/app/wallet -e SPRING_DATASOURCE_URL=\\\"\$DB_URL\\\" -e SPRING_DATASOURCE_USERNAME=\\\"\$DB_USERNAME\\\" -e SPRING_DATASOURCE_PASSWORD=\\\"\$DB_PASSWORD\\\" $ECR_REGISTRY/$ECR_REPOSITORY:latest\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM command $COMMAND_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"